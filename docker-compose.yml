services:
  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STREAMLIT_HOST_PORT:-8501}:8501"

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://app:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # La VM héberge déjà un second Airflow : une tâche globale, une tâche par DAG.
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-2}
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-1}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.session
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Définir AIRFLOW_JWT_SECRET dans .env}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?Définir AIRFLOW_JWT_SECRET dans .env}
      _AIRFLOW_DB_MIGRATE: "true"
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username admin --firstname Admin --lastname Local
        --role Admin --email admin@local.invalid --password "$${AIRFLOW_ADMIN_PASSWORD}"
        || airflow users reset-password --username admin --password "$${AIRFLOW_ADMIN_PASSWORD}")
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    env_file: .env
    environment: &airflow_environment
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://app:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # La VM héberge déjà un second Airflow : une tâche globale, une tâche par DAG.
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-2}
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-1}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__API__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.session
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Définir AIRFLOW_JWT_SECRET dans .env}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?Définir AIRFLOW_JWT_SECRET dans .env}
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@postgres:5432/app
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    env_file: .env
    environment: *airflow_environment
    command: dag-processor
    volumes:
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    env_file: .env
    environment: *airflow_environment
    command: api-server
    volumes:
      - ./dags:/opt/airflow/dags:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
