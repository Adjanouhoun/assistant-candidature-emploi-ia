[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assistant-candidature-emploi-ia"
version = "0.1.0"
description = "POC local de structuration de CV et de préparation de candidatures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "streamlit>=1.45",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/candidature_emploi"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
